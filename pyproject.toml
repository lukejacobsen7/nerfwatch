[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nerfwatch"
dynamic = ["version"]
description = "Is your model getting dumber? Local, zero-dependency drift tracker for LLM APIs and coding-agent subscriptions (Claude Code, Codex, Ollama, any OpenAI-compatible endpoint)."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Luke Jacobsen" }]
keywords = ["llm", "drift", "benchmark", "monitoring", "claude", "codex", "openai", "cusum", "irt", "rasch", "evals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lukejacobsen7/nerfwatch"
Source = "https://github.com/lukejacobsen7/nerfwatch"
Issues = "https://github.com/lukejacobsen7/nerfwatch/issues"
Changelog = "https://github.com/lukejacobsen7/nerfwatch/blob/main/CHANGELOG.md"

[project.scripts]
nerfwatch = "nerfwatch.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nerfwatch.__version__" }

[tool.setuptools.packages.find]
include = ["nerfwatch*"]

[tool.setuptools.package-data]
nerfwatch = ["py.typed"]
