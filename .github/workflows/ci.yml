name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/ -q
      - name: smoke the CLI without any backend
        env:
          NERFWATCH_HOME: ${{ runner.temp }}/nw
        run: |
          nerfwatch --version
          nerfwatch init
          nerfwatch show --quick | head -20
          nerfwatch report
          nerfwatch dashboard --no-open --out "$NERFWATCH_HOME/d.html"
          test -s "$NERFWATCH_HOME/d.html"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: wheel installs clean, has no runtime dependencies, and runs
        env:
          NERFWATCH_HOME: ${{ runner.temp }}/nw
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          test -z "$("$RUNNER_TEMP/venv/bin/pip" list --format=freeze | grep -v -E '^(nerfwatch|pip|setuptools)==')"
          ! unzip -p dist/*.whl '*/METADATA' | grep -q '^Requires-Dist:'
          "$RUNNER_TEMP/venv/bin/nerfwatch" --version
          "$RUNNER_TEMP/venv/bin/nerfwatch" init
          "$RUNNER_TEMP/venv/bin/nerfwatch" show --quick | grep -q -- '--- knights'
