name: release

# Publishes to PyPI when a version tag (v0.2.0, ...) is pushed. Uses PyPI trusted
# publishing (OIDC): no API token is stored anywhere. One-time setup on pypi.org:
# add a trusted publisher for this repo, workflow `release.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine pytest
      - name: tag matches nerfwatch.__version__
        run: |
          v=$(python -c "import nerfwatch; print(nerfwatch.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - run: python -m pytest tests/ -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nerfwatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
